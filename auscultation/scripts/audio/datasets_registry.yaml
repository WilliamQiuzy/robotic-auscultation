# 听诊声学质量模块 — 开源【肺音】数据集 + 预训练模型登记表
# ============================================================================
# 范围: 只听后背肺音 → 只收肺音/呼吸音, 不收心音。License 路线 = 研究/非商用(CC-BY-NC 可直接用)。
# 用途: 给 scripts/audio/download_audio_datasets.sh 读取; 也是人读的权威清单。
# 字段:
#   access:   open | request | unverified
#   license:  许可证(研究/非商用路线下均可用; 发表时遵守 CC-BY/NC/copyleft)
#   quality_labels: 是否含信号质量/噪声标签(本模块金标)
#   priority: anchor=主力 | support=辅助/多样性 | ssl=自监督预训练
# 全部事实在 2026-06-15 经联网核验; 标 unverified/flag 的需人工再确认。
# ============================================================================

lung_datasets:
  sprsound:
    name: "SPRSound (SJTU pediatric respiratory)"
    url: "https://github.com/SJTU-YONGFU-RESEARCH-GRP/SPRSound"
    access: open
    license: "CC-BY-4.0"
    size: "2683 records / 9089 events / 292 participants (repo 含 BioCAS 多年扩充, 更大)"
    sample_rate_hz: null          # repo 内确认
    format: "wav + json"
    device: "Yunting model II electronic stethoscope"
    quality_labels: true          # ★record 级 'Poor Quality' 类 (187 条)
    quality_note: "★唯一现成肺音质量金标: 'Poor Quality' 类。本模块主锚"
    priority: anchor

  icbhi2017:
    name: "ICBHI 2017 Respiratory Sound Database"
    url: "https://bhichallenge.med.auth.gr/ICBHI_2017_Challenge"
    kaggle_mirror: "vbookshelf/respiratory-sound-database"
    archive_url: "https://bhichallenge.med.auth.gr/sites/default/files/ICBHI_final_database/ICBHI_final_database.zip"  # 官方站证书过期 → curl -k
    access: open
    license: "research-use"
    size: "920 recordings / 126 subjects / ~5.5h / 6898 cycles"
    sample_rate_hz: "4000/10000/44100 (mixed — 显式重采样)"
    format: wav
    device: "Littmann 3200, WelchAllyn Meditron (electronic) + AKG C417L + Littmann Classic II SE"
    quality_labels: false         # 噪声未标; crackle/wheeze + 呼吸周期
    quality_note: "设备多样性(4种)→ 防过拟合单一听诊器; 杂音/周期标"
    priority: anchor              # 设备多样性 anchor

  hf_lung_v1:
    name: "HF_Lung_V1"
    url: "https://gitlab.com/techsupportHF/HF_Lung_V1"
    access: open
    license: "CC-BY-4.0"
    size: "9765 x 15s clips / 279 participants"
    sample_rate_hz: 4000
    format: wav
    device: "Littmann 3200 + HF-Type-1 (8-mic array); ICU/呼吸机"
    quality_labels: false         # ICU 高噪声 = 天然难例; 含吸/呼相标
    quality_note: "ICU/呼吸机段=真实高噪声硬负例; 呼吸相标→无气流/无呼吸质量代理"
    priority: support

  kauh:
    name: "KAUH lung sounds (Mendeley)"
    url: "https://data.mendeley.com/datasets/jwyy9np4gv/3"
    access: open
    license: "CC-BY-4.0"
    size: "112 subjects / 336 files (3 filter modes)"
    sample_rate_hz: null
    format: "wav + zsa"
    device: "Littmann 3200 (electronic, Bluetooth)"
    quality_labels: false
    quality_note: "干净参考分布; ⚠️Mendeley 需浏览器下载(DOI 10.17632/jwyy9np4gv.3)"
    priority: support

  respiratory_tr:
    name: "RespiratoryDatabase@TR (multichannel lung)"
    url: "https://data.mendeley.com/datasets/p9z4h98s6j/1"
    paper: "https://arxiv.org/pdf/2101.10946"
    access: open
    license: "CC-BY-4.0"
    size: "77 subjects / 12-ch lung"
    sample_rate_hz: 4000
    format: null
    device: "digital stethoscopes (multichannel)"
    quality_labels: false
    quality_note: "多通道→空间/SNR一致性特征; ⚠️Mendeley 需浏览器下载"
    priority: support

ssl_pretrain_audio:
  # 仅自监督预训练(非听诊器, 手机/麦克风呼吸咳嗽), 别进有监督质量集
  coswara:
    name: "Coswara (breath/cough/voice)"
    url: "https://github.com/iiscleap/Coswara-Data"
    zenodo: "https://zenodo.org/records/7188627"
    access: open
    license: "CC-BY-4.0"
    device: "phone mic (非听诊器)"
    quality_labels: false
    priority: ssl
  coughvid:
    name: "COUGHVID (>20k coughs)"
    url: "https://zenodo.org/records/4048312"
    access: open
    license: "CC"
    device: "web/phone mic (非听诊器)"
    quality_labels: false
    priority: ssl

# ============================================================================
pretrained_models:   # 研究路线: 全部可直接用(发表遵守各自 license)
  opera:
    name: "OPERA — OPen Respiratory Acoustic foundation model (Cambridge)"
    repo: "evelyn0414/OPERA"              # CT/CE/GT 三变体; GitHub github.com/evelyn0414/OPERA
    access: open
    license: "CC-BY-NC-4.0"               # 研究可用
    pretrain: "~136k samples / ~404h 呼吸音(breathing/cough/lung)"
    input: "16kHz, 8s, 64-mel"
    output: "768-d (OPERA-CT)"
    role: "★首选肺音主编码器: 呼吸音专用 foundation model, 与任务最贴合"
    priority: anchor
  hear:
    name: "HeAR — Google Health Acoustic Representations"
    repo: "google/hear-pytorch"
    access: gated                         # HF 登录 + 接受 HAI-DEF 条款(研究允许)
    license: "HAI-DEF terms"
    pretrain: "313M x 2s health sounds (cough/breathing)"
    input: "16kHz mono, 2s clips"
    output: "512-d (ViT-L MAE)"
    role: "强健康声 frozen embedder; 肺/呼吸音备选"
    priority: support
    flag: "gated; 需接受条款"
  auscultabase:
    name: "AuscultaBase (心+肺+肠, 取肺)"
    repo: "https://github.com/applewpj/AuscultaBase"   # 权重在 Google Drive
    access: open
    license: "mixed/NC"
    pretrain: "11 datasets / 40k recordings / 322h (含真实听诊器肺音)"
    input: "spectrogram"
    output: "contrastive encoder"
    role: "听过真实听诊器肺音; 研究可用"
    priority: support
    flag: "权重在 Google Drive; 浏览器确认"
  wavlm:
    name: "WavLM (Microsoft, noise/overlap-aware)"
    repo: "microsoft/wavlm-base-plus"
    access: open
    license: "CC-BY-SA-3.0"
    pretrain: "speech + 去噪/重叠 (94k h)"
    input: "16kHz raw waveform"
    output: "768-d (base) / 1024-d (large)"
    role: "★质量代理首选先验: embedding 已编码 SNR/干扰"
    priority: anchor
  beats:
    name: "BEATs (Microsoft, audio SSL SOTA)"
    repo: "https://github.com/microsoft/unilm/tree/master/beats"   # 权重 OneDrive
    access: open
    license: "MIT"
    pretrain: "AudioSet (AS-2M) SSL"
    input: "16kHz, 128-mel"
    output: "768-d"
    role: "强通用 frozen backbone(对照)"
    priority: support
  clap_laion:
    name: "CLAP (LAION, 文本-音频零样本)"
    repo: "laion/clap-htsat-unfused"
    access: open
    license: "Apache-2.0"
    pretrain: "LAION-Audio-630K + AudioSet"
    input: "48kHz, 64-mel"
    output: "512-d joint audio/text"
    role: "零样本: 'muffled/clipped/noisy' 文本探针无标打质量分"
    priority: support
  panns_cnn14:
    name: "PANNs / CNN14 (AudioSet)"
    repo: "https://github.com/qiuqiangkong/audioset_tagging_cnn"   # pip panns-inference
    access: open
    license: "MIT"
    pretrain: "AudioSet (527 cls)"
    input: "32kHz, 64-mel"
    output: "2048-d + 527 logits"
    role: "轻量 baseline embedder"
    priority: support

# ============================================================================
quality_tools:   # 自监督质量代理 / 呼吸检出 / 参考-free 质量(肺音相关)
  grooby_sqi:
    name: "Grooby Heart-and-Lung Signal-Quality Estimation (5-level SQI)"
    repo: "https://github.com/egrooby-monash/Heart-and-Lung-Signal-Quality-Estimation"
    license: "GPL-3.0"                                # 研究可用; MATLAB
    computes: "power ratios, autocorrelation periodicity, SNR (取肺部分)"
    use: "★肺音多级 SQI → 弱标/teacher 信号"
    priority: anchor
  hf_lung_breath:
    name: "HF_Lung 呼吸相/气流检出 (inhale/exhale 标 + RNN 基线)"
    repo: "https://gitlab.com/techsupportHF/HF_Lung_V1"
    license: "CC-BY-4.0"
    computes: "吸气/呼气段检出"
    use: "无气流/无呼吸 → 质量代理"
    priority: support
  torchaudio_squim:
    name: "torchaudio SQUIM (参考-free 质量)"
    repo: "torchaudio.pipelines.SQUIM_OBJECTIVE / SQUIM_SUBJECTIVE"
    license: "BSD-2"
    computes: "无参考估计 STOI/PESQ/SI-SDR; MOS via NMR"
    use: "参考-free 质量回归模板(语音训练, 需在肺音重校)"
    priority: support
  nisqa:
    name: "NISQA (多维无参考质量)"
    repo: "https://github.com/gabrielmittag/NISQA"
    license: "code MIT, weights CC-BY-NC-SA-4.0"      # 研究可用
    computes: "MOS + Noisiness/Coloration/Discontinuity/Loudness"
    use: "★最佳架构模板: noisiness≈运动伪影, discontinuity≈听诊器掉接触"
    priority: anchor
  feature_libs:
    name: "声学特征库 (librosa / scipy.signal / spkit / nnAudio)"
    license: "ISC / BSD / MIT"
    computes: "谱质心/平坦度/rms/zcr/mfcc; welch PSD; 谱熵(spkit); 削波/静音比"
    use: "基础 SNR/削波/静音/突发噪声 自监督代理"
    priority: support
