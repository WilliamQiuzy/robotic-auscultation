name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  policy:
    name: simulation, expert and policy logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-build-ci.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install pip==26.0.1
          python -m pip install --build-constraint requirements-build-ci.txt -r requirements-ci.txt
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        # These three files open the binary USD scene assets, which are kept out of git.
        # The positive original-owner fixture requires an unoptimized -B interpreter.
        run: >
          python -B -m pytest tests -q
          --ignore=tests/test_ausc_policy_passive_preload.py
          --ignore=tests/test_ausc_policy_retainer_geometry.py
          --ignore=tests/test_ausc_policy_m2_sensor_probe.py

      - name: Verify source26 partial capsule and selected CPU fixtures
        # Independent tree; retain original skip reasons and import boundary checks.
        run: |
          python -B -m unittest demo_tests.test_source26_capsule -v
          python -I -B repro/source26/verify_capsule.py --fixtures

      - name: Verify source28 partial capsule and selected CPU fixtures
        # Independent tree; retain original skip reasons and import boundary checks.
        run: |
          python -B -m unittest demo_tests.test_source28_capsule -v
          python -I -B repro/source28/verify_capsule.py --fixtures

  perception:
    name: point tracking and robot safety logic
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auscultation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-build-ci.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install pip==26.0.1
          python -m pip install --build-constraint ../requirements-build-ci.txt -r ../requirements-ci.txt
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        # Skipped: tests that need the converted NVIDIA OpenArm assets (built locally, not in git).
        run: >
          python -m pytest ausc/perception/tracking/tests ausc/perception/robot/tests
          ausc/perception/eval/tests ausc/perception/tests ausc/perception/test_camera_stream.py -q
          --ignore=ausc/perception/tracking/tests/test_offline_mesh_simulation.py
          --ignore=ausc/perception/tracking/tests/test_offline_official_mesh_assets.py
          --ignore=ausc/perception/tracking/tests/test_offline_official_mesh_experiment.py
          --ignore=ausc/perception/tracking/tests/test_official_asset_contract.py
